# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master
- development

variables:
  - group: PAT-group

name: $(SourceBranchName)_$(date:yyyyMMdd).$(date:HHmm)
stages:
  - stage: Build
    jobs:
      - job: Build_Monitor
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Docker@2
            displayName: Build
            inputs:
              command: build
              containerRegistry: 'appset-registry'
              repository: 'service-monitor'
              tags: $(Build.BuildNumber)
              arguments: --build-arg PAT=$(registry-PAT)
              Dockerfile: './Dockerfile'

          - task: Docker@2
            displayName: Push
            inputs:
              command: push
              containerRegistry: 'appset-registry'
              repository: 'appointments'
              tags: $(Build.BuildNumber)
              Dockerfile: './Dockerfile'      